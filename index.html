<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seguimiento de Botiquines · Musicala</title>
  <meta
    name="description"
    content="Control de inventario, vencimientos y reposiciones de los botiquines de Musicala para el SGSST."
  />
  <meta name="theme-color" content="#8c52ff" />

  <link rel="icon" href="./assets/logo.png" />
  <link rel="apple-touch-icon" href="./assets/logo.png" />

  <link rel="stylesheet" href="./css/app.css?v=2" />
</head>
<body>
  <div class="capa">
    <header class="cabecera">
      <div class="cabecera__marca">
        <img
          src="./assets/logo.png"
          alt=""
          class="cabecera__logo"
          onerror="this.style.display='none'"
        />
        <div>
          <p class="cabecera__organizacion">Musicala · SGSST</p>
          <h1 class="cabecera__titulo" id="tituloVista">Revisión de botiquines</h1>
        </div>
      </div>

      <nav class="menu" id="menu" aria-label="Secciones"></nav>

      <span class="chip chip--cargando" id="estadoConexion" role="status" aria-live="polite">
        Conectando...
      </span>
    </header>

    <main class="contenido">
      <section data-panel="revision" aria-label="Revisión de botiquines"></section>
      <section data-panel="pedido" aria-label="Pedido consolidado" hidden></section>
      <section data-panel="historial" aria-label="Historial" hidden></section>
    </main>
  </div>

  <noscript>
    <p style="padding:2rem;text-align:center">
      Esta aplicación necesita JavaScript activado para funcionar.
    </p>
  </noscript>

  <script type="module" src="./js/app.js?v=2"></script>
</body>
</html>
